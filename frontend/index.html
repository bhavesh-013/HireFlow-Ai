<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>

  <!-- Google Fonts -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Font Awesome -->

    rel="stylesheet"

  <link rel="stylesheet" href="./assets/css/globals.css">

    <div>

    </div>

    <button
      class="banner-close"

  </div>

    <div class="container navbar-container">

      <!-- Logo -->
      <a

        id="nav-brand-logo">

        <div class="brand-icon">
          <i class="fa-solid fa-briefcase"></i>
        </div>

        <span>
          HireFlow
          <span style="color: var(--accent-blue);">
            AI
          </span>
        </span>

      </a>

      <!-- Navigation -->
      <nav class="nav-links">

        <a
          href="#"
          data-nav="landing"
          class="nav-link active">

          Home

        </a>

        <a
          href="#"
          data-nav="templates"
          class="nav-link">

          Templates

        </a>

        <a
          href="#"
          data-nav="builder"
          class="nav-link">

          Build Resume

        </a>

        <a
          href="#"
          data-nav="analyzer"
          class="nav-link">

          ATS Analysis

        </a>

        <a
          href="#"
          data-nav="assistant"
          class="nav-link">

          AI Assistant

        </a>

      </nav>

      <!-- Right Actions -->
      <div class="nav-actions">

        <div
          class="theme-switch"
          id="theme-toggle-switch"
          title="Toggle Theme">

          <div class="theme-switch-handle">
            <i class="fa-solid fa-moon"></i>
          </div>

        </div>

        <a
          href="./pages/login/login.html"
          class="btn btn-ghost"
          id="btn-nav-signin">

          Sign In

        </a>

        <a
          href="#"
          data-nav="builder"
          class="btn btn-primary-glow"
          id="btn-nav-getstarted">

          Build Resume

        </a>

      </div>

    </div>

  </header>

  ============================ -->
  <main id="app-root">

  </main>

       Global Components
  ============================ -->

  <!-- AI Career Coach Drawer -->
  <div id="coach-drawer-host"></div>

  <!-- Authentication Modal -->
  <div id="auth-modal-host"></div>

  <!-- Toast Notifications -->

       Application Scripts
  ============================ -->

  <script src="./services/state.js"></script>
  <script src="./services/aiService.js"></script>

  <!-- Layout -->
  <script src="./components/workspaceLayout.js"></script>

  <script src="./pages/builder/resumeEditorView.js"></script>
